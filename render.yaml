services:
  - type: web
    name: auxilium-consult
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://auxilium-consult.onrender.com
    healthCheckPath: /
    autoDeploy: true
